<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timesheet to payroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F7F6F3; --surface:#FFFFFF; --sunk:#FBFAF8;
  --border:#E0DDD6; --border-strong:#D8D4CC;
  --ink:#14304F; --ink-2:#78756D; --ink-3:#8A877F;
  --ring:#1A1A17;
  --ok:#059669; --ok-bg:#E6F4EE;
  --wait:#F5C518; --wait-bg:#FDF6DA; --pale:#FCEFB4;
  --danger:#8F1D1D; --danger-bg:#F8E9E5; --danger-br:#EBC0B6;
  --accent:#14304F; --accent-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(20,48,79,.05), 0 10px 28px -22px rgba(20,48,79,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#12161B; --surface:#1A1F26; --sunk:#161B21;
  --border:#2A313A; --border-strong:#3A424D;
  --ink:#DCE5EF; --ink-2:#9AA3AE; --ink-3:#7C8590; --ring:#DCE5EF;
  --ok:#3F8F6E; --ok-bg:#16241F; --wait:#E8C55C; --wait-bg:#2A2517; --pale:#33301F;
  --danger:#E08C7A; --danger-bg:#2D1E1B; --danger-br:#5A322A;
  --accent:#DCE5EF; --accent-ink:#12161B;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -22px rgba(0,0,0,.9);
}}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}
.num{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{letter-spacing:-.015em;margin:0}

.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:28px;box-shadow:var(--shadow)}
.gate h1{font-size:20px;margin-bottom:4px}
.gate .sub{color:var(--ink-2);font-size:13.5px;margin:0 0 18px}
.badge-demo{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-strong);
  background:var(--sunk);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink-2);margin-bottom:16px}
.badge-demo b{color:var(--ink);font-weight:600}
.gate label{display:block;font-size:12.5px;color:var(--ink-2);margin:14px 0 5px}
.gate select{width:100%}
.domain{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);font-size:12.5px;color:var(--ink-3)}
.domain b{color:var(--ink-2)}

.top{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:env(safe-area-inset-top,0px);z-index:40}
.top-in{max-width:1340px;margin:0 auto;padding:10px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between}
.brand{font-size:13px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.brand span{display:block;font-size:11.5px;font-weight:400;color:var(--ink-3);letter-spacing:0}
.nav{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0}
.nav button{background:none;border:0;border-radius:5px;padding:6px 11px;font-size:13.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.nav button[aria-current="page"]{background:var(--sunk);border:1px solid var(--border);color:var(--ink);font-weight:600}
.who{display:flex;align-items:center;gap:10px}
.who .nm{font-size:13px;font-weight:600;text-align:right;line-height:1.25}
.who .nm span{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3)}
.bell{position:relative;background:none;border:1px solid var(--border);border-radius:6px;width:34px;height:32px;cursor:pointer;font-size:13px}
.bell b{position:absolute;top:-6px;right:-6px;background:var(--ink);color:var(--surface);border-radius:999px;
  font-size:10.5px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;font-weight:600}
.rail{background:var(--sunk);border-bottom:1px solid var(--border)}
.rail-in{max-width:1340px;margin:0 auto;padding:8px 18px;font-size:13px;color:var(--ink-2)}
.rail-in b{color:var(--ink);font-weight:600}
.shell{max-width:1340px;margin:0 auto;padding:18px;display:grid;gap:18px;grid-template-columns:minmax(0,1fr) 316px;align-items:start}
@media (max-width:1060px){.shell{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:7px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.card-h{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px;justify-content:space-between;align-items:baseline;flex-wrap:wrap}
.card-h h2{font-size:14.5px;font-weight:600}
.card-h p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2);max-width:74ch}
.card-b{padding:16px}
.card-b.flush{padding:0}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:820px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:13px 14px;box-shadow:var(--shadow);text-align:left;cursor:pointer;width:100%}
.kpi .v{font-size:26px;font-weight:600;font-family:"IBM Plex Mono",monospace;line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--ink-2);margin-top:4px;display:flex;align-items:center;gap:6px}

.mk{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;flex:none;
  font-size:9px;line-height:1;color:var(--ring);border:1px solid var(--ring)}
.mk-draft{border-style:dashed;background:transparent}
.mk-submitted{background:linear-gradient(90deg,var(--ring) 50%,transparent 50%)}
.mk-approved{background:var(--ok);color:#fff}
.mk-processed{background:var(--ink);color:var(--surface);border-radius:2px}
.mk-returned{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border-strong);background:var(--sunk);
  border-radius:999px;padding:1px 9px;font-size:11.5px;color:var(--ink-2)}
.pill.warn{background:var(--wait-bg);border-color:var(--wait);color:var(--ink)}
.pill.bad{background:var(--danger-bg);border-color:var(--danger-br);color:var(--danger)}
.pill.good{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}

.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;font-weight:500;font-size:12px;color:var(--ink-2);padding:9px 12px;
  border-bottom:1px solid var(--border-strong);white-space:nowrap;background:var(--sunk)}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover td{background:var(--sunk)}
tbody tr.sel td{box-shadow:inset 3px 0 0 var(--ink)}
tfoot td{padding:9px 12px;border-top:1px solid var(--border-strong);font-weight:600;background:var(--sunk)}
.muted{color:var(--ink-3)}

.btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:6px;padding:7px 13px;
  font-size:13.5px;font-weight:500;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:transparent;background:none;color:var(--ink-2);padding-inline:5px;text-decoration:underline;text-underline-offset:2px}
.btn.quiet:hover{color:var(--ink)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=number],input[type=date],textarea{
  background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;padding:7px 9px;font-size:13.5px;max-width:100%}
textarea{width:100%;min-height:64px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--ink-2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.toggle{display:inline-flex;gap:7px;align-items:center;font-size:13px;color:var(--ink-2);cursor:pointer}
.note{border:1px solid var(--border);border-left:3px solid var(--ink);background:var(--sunk);
  border-radius:6px;padding:10px 13px;font-size:13px;color:var(--ink-2);margin:0 0 14px}
.note b{color:var(--ink);font-weight:600}
.note.bad{border-color:var(--danger-br);border-left-color:var(--danger);background:var(--danger-bg);color:var(--danger)}
.note.bad b{color:var(--danger)}
.empty{padding:26px 16px;text-align:center;color:var(--ink-3);font-size:13.5px}

.wk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) 104px;gap:8px}
@media (max-width:700px){.wk{grid-template-columns:repeat(3,minmax(0,1fr))}}
.d{border:1px solid var(--border);border-radius:6px;padding:7px 8px;background:var(--surface);min-width:0}
.d>label{display:block;font-size:11.5px;color:var(--ink-2)}
.d>label em{font-style:normal;color:var(--ink-3);display:block}
.d input{width:100%;border:0;padding:0;background:none;font-size:17px;font-weight:500;
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;margin-top:3px}
.d input::-webkit-outer-spin-button,.d input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.d input[type=number]{-moz-appearance:textfield}
.d.blocked{background:repeating-linear-gradient(135deg,var(--sunk),var(--sunk) 5px,var(--surface) 5px,var(--surface) 10px);border-style:dashed}
.d .why{font-size:11px;color:var(--ink-2);margin-top:4px;line-height:1.3}
.d.tot{background:var(--sunk);border-color:var(--border-strong)}
.d .val{font-size:17px;font-weight:600;font-family:"IBM Plex Mono",monospace;margin-top:3px}
.d.over .val{color:var(--danger)}

.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px)}
@media (max-width:1060px){.side{position:static}}
.trail{max-height:min(66vh,680px);overflow-y:auto;padding:4px 0 8px}
@media (max-width:1060px){.trail{max-height:none}}
.ev{display:grid;grid-template-columns:15px minmax(0,1fr);gap:9px;padding:8px 16px;position:relative}
.ev::before{content:"";position:absolute;left:23px;top:0;bottom:0;width:1px;background:var(--border)}
.ev:first-child::before{top:16px}.ev:last-child::before{bottom:calc(100% - 16px)}
.ev .mk{margin-top:3px;z-index:1;box-shadow:0 0 0 3px var(--surface)}
.ev-t{font-size:13px;font-weight:600}
.ev-t span{font-weight:400;color:var(--ink-2)}
.ev-m{font-size:11.5px;color:var(--ink-3)}
.ev-p{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.ev-p.q{border-left:2px solid var(--border-strong);padding-left:7px;color:var(--ink)}

.scrim{position:fixed;inset:0;background:rgba(20,48,79,.32);display:grid;place-items:center;padding:20px;z-index:80}
.modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;width:100%;max-width:540px;
  box-shadow:0 24px 60px -24px rgba(20,48,79,.5);max-height:86vh;display:flex;flex-direction:column}
.modal-h{padding:15px 18px;border-bottom:1px solid var(--border)}
.modal-h h3{font-size:15.5px}
.modal-b{padding:16px 18px;overflow-y:auto}
.modal-b p{margin:0 0 10px}
.modal-f{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--surface);padding:9px 15px;border-radius:6px;font-size:13.5px;z-index:90;max-width:calc(100vw - 32px)}
.drop{position:absolute;right:0;top:42px;width:320px;background:var(--surface);border:1px solid var(--border-strong);
  border-radius:8px;box-shadow:var(--shadow);z-index:60;max-height:380px;overflow-y:auto}
.drop .n{padding:10px 13px;border-bottom:1px solid var(--border);font-size:13px}
.drop .n:last-child{border-bottom:0}
.drop button.n{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--border);cursor:pointer;font:inherit;color:inherit}
.drop button.n:hover{background:var(--sunk)}
.drop button.n:last-child{border-bottom:0}
.drop .n.unread{background:var(--sunk)}
.drop .n small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}
.whoWrap{position:relative}
.foot{max-width:1340px;margin:0 auto;padding:4px 18px 36px;font-size:12px;color:var(--ink-3);
  display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:999px;overflow:hidden;background:var(--sunk);flex-wrap:wrap}
.seg button{background:none;border:0;border-right:1px solid var(--border);padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
"use strict";
/* ── dates ── */
const DAY=86400000;
const d0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const P=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const fD=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
const fDY=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const fFull=d=>d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
const fTime=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+', '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const H=n=>(+n||0).toFixed(2), M=n=>'$'+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const TODAY=d0(new Date());
const ANCHOR=add(TODAY,-((TODAY.getDay()-5+7)%7));

/* ── federal holidays ── */
function nthDow(y,m,dow,n){const f=new Date(y,m,1);return new Date(y,m,1+((dow-f.getDay()+7)%7)+(n-1)*7)}
function lastDow(y,m,dow){const l=new Date(y,m+1,0);return add(l,-((l.getDay()-dow+7)%7))}
const HOLIDAYS={};
for(let y=TODAY.getFullYear()-3;y<=TODAY.getFullYear()+2;y++){
  [['New Year\u2019s Day',new Date(y,0,1)],['Martin Luther King Jr. Day',nthDow(y,0,1,3)],
   ['Presidents\u2019 Day',nthDow(y,1,1,3)],['Memorial Day',lastDow(y,4,1)],['Juneteenth',new Date(y,5,19)],
   ['Independence Day',new Date(y,6,4)],['Labor Day',nthDow(y,8,1,1)],['Columbus Day',nthDow(y,9,1,2)],
   ['Veterans Day',new Date(y,10,11)],['Thanksgiving Day',nthDow(y,10,4,4)],['Christmas Day',new Date(y,11,25)]]
  .forEach(function(h){let o=h[1];if(o.getDay()===6)o=add(o,-1);if(o.getDay()===0)o=add(o,1);HOLIDAYS[iso(o)]=h[0]});
}
const isHoliday=d=>HOLIDAYS[iso(d)]||null;
const isBiz=d=>d.getDay()!==0&&d.getDay()!==6&&!isHoliday(d);

/* ── pay calendar, derived ── */
function payRun(sched){
  let pay=sched;while(!isBiz(pay))pay=add(pay,-1);
  const due=add(pay,-2);
  let cut=due;while(cut.getDay()!==5)cut=add(cut,-1);
  const label=sched.getDate()===15?sched.toLocaleDateString('en-US',{month:'short'})+' 1\u201315'
    :sched.toLocaleDateString('en-US',{month:'short'})+' 16\u2013'+sched.getDate();
  return{id:'PR-'+iso(sched),label,year:sched.getFullYear(),scheduled:iso(sched),payday:iso(pay),
    due:iso(due),cutoff:iso(cut),shifted:iso(pay)!==iso(sched)};
}
const RUNS=(function(){
  const out=[];const from=add(ANCHOR,-820),to=add(ANCHOR,130);
  let y=from.getFullYear(),m=from.getMonth();
  while(new Date(y,m,1)<=to){out.push(payRun(new Date(y,m,15)));out.push(payRun(new Date(y,m+1,0)));
    m++;if(m>11){m=0;y++}}
  return out.sort((a,b)=>a.payday<b.payday?-1:1);
})();
const runForWeek=we=>RUNS.find(r=>r.cutoff>=we)||RUNS[RUNS.length-1];
const nextRun=()=>RUNS.find(r=>r.cutoff>=iso(TODAY))||RUNS[RUNS.length-1];

/* ── reference data, from the FinOS books ── */
const ENTITIES=[{id:'CT-US',name:'CoreThread',domain:'corethread'},
                {id:'NC-US',name:'NexCore',domain:'nexcore'}];
const ACCOUNTS={5000:'COGS \u2014 Delivery Labour',5020:'COGS \u2014 Support',
  6000:'S&M \u2014 People',6100:'R&D \u2014 People',6200:'G&A \u2014 People'};
const FUNCTIONS={'Delivery':5000,'Solutions & Support':5020,'Product Engineering':6100,
  'R&D':6100,'Sales & Marketing':6000,'G&A':6200};
const STREAMS={
  'CT-US':[{id:'tm',name:'T&M',bill:true,cust:'required',acct:5000},
           {id:'sup',name:'Support',bill:true,cust:'required',acct:5020},
           {id:'ms',name:'Milestone',bill:true,cust:'required',acct:5000},
           {id:'int',name:'Internal',bill:false,cust:'none',acct:null}],
  'NC-US':[{id:'radar',name:'RadarIQ',bill:false,cust:'optional',acct:null},
           {id:'hive',name:'HiveIQ',bill:false,cust:'optional',acct:null},
           {id:'trace',name:'TraceIQ',bill:false,cust:'optional',acct:null},
           {id:'aperture',name:'ApertureIQ',bill:false,cust:'optional',acct:null},
           {id:'int',name:'Internal',bill:false,cust:'none',acct:null}]};
const CUSTOMERS=[['CT-US','Hollis Group','Active'],['CT-US','Zephyr Industries','Active'],
 ['CT-US','Eastvale Technologies','Active'],['CT-US','Northwind Holdings','Active'],
 ['CT-US','Thornton Systems','Active'],['CT-US','Onyx Industries','Active'],
 ['CT-US','Cerulean Industries','Active'],['CT-US','Wexford Systems','Active'],
 ['CT-US','Zephyr Holdings','Active'],['CT-US','Pinnacle Systems','Churned'],['CT-US','Merrivale Inc','Churned'],
 ['NC-US','Checkout Analytics','Active'],['NC-US','Servo Solutions','Active'],['NC-US','Pinion Automation','Active'],
 ['NC-US','Axiom Automation','Active'],['NC-US','CarePoint Controls','Active'],['NC-US','Bluepeak Corp','Active'],
 ['NC-US','Sterling Global','Active'],['NC-US','Ashford Holdings','Active'],['NC-US','Dynamo Networks','Churned']]
 .map(a=>({entity:a[0],name:a[1],status:a[2]}));

function rng(seed){let s=seed>>>0;return function(){s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}

/* ── state ── */
let S,seq,session,ui,EV={};
const nid=p=>p+(++seq);
const rateAsOf=(rates,u,on)=>rates.filter(r=>r.user===u&&r.from<=on).sort((a,b)=>a.from<b.from?1:-1)[0]||null;
const accountFor=(st,fn)=>(st&&st.bill&&st.acct)?st.acct:(FUNCTIONS[fn]||6200);

function seed(){
  seq=0;const R=rng(20260920);
  const users=[
   {id:'u1',name:'Bob Ellis',entity:'CT-US',role:'intern',pay:'hourly',fn:'Delivery',mgr:'u5',weekly:40,daily:null,weeks:11,active:true},
   {id:'u2',name:'Daniel Scott',entity:'CT-US',role:'consultant',pay:'hourly',fn:'Delivery',mgr:'u5',weekly:40,daily:null,weeks:104,active:true},
   {id:'u3',name:'Ashley Davis',entity:'CT-US',role:'consultant',pay:'hourly',fn:'Solutions & Support',mgr:'u5',weekly:40,daily:null,weeks:73,active:true},

const STATUS={created:'draft',submitted:'submitted',returned:'draft',approved:'approved',processed:'processed',reopened:'draft'};
function rebuild(){EV={};S.events.forEach(e=>{(EV[e.ts]=EV[e.ts]||[]).push(e)});
  Object.keys(EV).forEach(k=>EV[k].sort((a,b)=>a.at===b.at?(a.id<b.id?-1:1):(a.at<b.at?-1:1)))}
const evs=id=>EV[id]||[];
const statusOf=id=>{const a=evs(id);return a.length?STATUS[a[a.length-1].type]:'draft'};
const lastEv=(id,t)=>{const a=evs(id).filter(e=>e.type===t);return a.length?a[a.length-1]:null};
const snapOf=id=>['approved','processed'].includes(statusOf(id))?lastEv(id,'approved').payload:null;
const procOf=id=>statusOf(id)==='processed'?lastEv(id,'processed').payload:null;
const user=id=>S.users.find(u=>u.id===id)||{name:'\u2014',fn:''};
const uName=id=>user(id).name;
const streamOf=ts=>(STREAMS[ts.entity]||[]).find(s=>s.id===ts.stream)||{name:'\u2014',cust:'none'};
const sheetsOf=u=>S.timesheets.filter(t=>t.user===u).sort((a,b)=>a.we<b.we?1:-1);
const hoursOf=ts=>{const s=lastEv(ts.id,'submitted');return s?s.payload.hours:(ts.draftHours||[0,0,0,0,0])};
const totOf=ts=>hoursOf(ts).reduce((a,b)=>a+(+b||0),0);
function blockedDays(u,we){const out=[];for(let i=0;i<5;i++){const d=add(P(we),-(4-i));
  const h=isHoliday(d),t=S.timeOff.find(x=>x.user===u&&x.date===iso(d));
  out.push(h?{why:h,src:'Federal calendar'}:t?{why:t.label,src:'HRIS'}:null)}return out}
function windowOf(we){const open=add(P(we),-4),lock=add(P(we),14),run=runForWeek(we);
  if(TODAY<open)return{state:'future',run,lock,open};
  if(iso(TODAY)<=run.cutoff)return{state:'open',run,lock,open};
  if(TODAY<=lock)return{state:'late',run:runForWeek(iso(add(P(we),7))),lock,open};
  return{state:'locked',run,lock,open}}
function record(ts,type,actor,payload){S.events.push({id:nid('e'),ts,type,actor,at:new Date().toISOString(),payload:payload||{}});rebuild()}
const notify=(u,text,go)=>S.notifications.push({id:nid('n'),user:u,at:new Date().toISOString(),read:false,text,go:go||null});

function eligibleWeeks(u){
  const out=[];
  for(let n=3;n>=0;n--){const we=iso(add(ANCHOR,-7*n));
    if(P(we)<add(ANCHOR,-7*(u.weeks-1)))continue;
    const has=S.timesheets.find(t=>t.user===u.id&&t.we===we);
    out.push({we,has,st:has?statusOf(has.id):null,w:windowOf(we)})}
  return out;
}

  const ts=S.timesheets.find(t=>t.user===me.id&&t.we===target);

  const streams=STREAMS[me.entity],sid=(ts&&ts.stream)||streams[0].id,sDef=streams.find(s=>s.id===sid);

  const run=win.run;
  return '<div class="card"><div class="card-h"><div><h2>Where you stand</h2><p>The '+esc(run.label)+' run pays '+fDY(P(run.payday))+

   '<div class="card-b flush"><div class="scroll"><table><thead><tr><th>Week ending</th><th>State</th><th>Window</th><th></th></tr></thead><tbody>'+
   el.map(x=>'<tr><td>'+fDY(P(x.we))+'</td><td>'+(x.has?statusMark(x.has.id):mark('draft','Not started'))+'</td><td>'+
    (x.w.state==='open'?'Open, on time':x.w.state==='late'?'<span class="pill warn">Late \u2014 reason required</span>':
     x.w.state==='future'?'Opens '+fD(x.w.open):'<span class="pill bad">Locked '+fD(x.w.lock)+'</span>')+'</td>'+
    '<td class="r">'+((!x.st||x.st==='draft')&&x.w.state!=='future'&&x.w.state!=='locked'
      ?'<button class="btn sm" data-week="'+x.we+'">'+(x.we===target?'Editing':'Open')+'</button>':'')+'</td></tr>').join('')+
   '</tbody></table></div></div></div>'+
  '<div class="card"><div class="card-h"><div><h2>Week ending '+fFull(P(target))+'</h2><p>Monday to Friday. Blocked days cannot be filled.</p></div>'+
   (win.state==='late'?'<span class="pill warn">Past cutoff</span>':'')+'</div><div class="card-b">'+
   (ret&&editable?'<div class="note bad"><b>Returned by '+esc(uName(ret.actor))+'.</b> '+esc(ret.payload.reason)+'</div>':'')+
   (!editable?'<div class="note">This week is '+esc(statusOf(ts.id))+' and can no longer be edited.</div>':'')+
   '<div class="row" style="margin-bottom:14px"><label class="field"><span>Stream</span><select id="f-stream" '+(editable?'':'disabled')+'>'+
    streams.map(s=>'<option value="'+s.id+'" '+(s.id===sid?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></label>'+
   '<label class="field"><span>Customer'+(sDef.cust==='optional'?' (optional)':'')+'</span><select id="f-cust" '+(editable&&sDef.cust!=='none'?'':'disabled')+'>'+
    '<option value="">'+(sDef.cust==='none'?'Not applicable':'Choose a customer')+'</option>'+
    custs.map(c=>'<option value="'+esc(c.name)+'" '+(ts&&ts.customer===c.name?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></label></div>'+
   '<div class="wk">'+cur.map((h,i)=>{const d=add(P(target),-(4-i)),b=bl[i];
     return '<div class="d '+(b?'blocked':'')+'"><label>'+['Mon','Tue','Wed','Thu','Fri'][i]+'<em>'+fD(d)+'</em></label>'+
      (b?'<div class="why">'+esc(b.why)+'<br><span class="muted">'+esc(b.src)+'</span></div>'
        :'<input type="number" inputmode="decimal" min="0" max="'+cap+'" step="0.5" value="'+(h||'')+'" placeholder="0" data-h="'+i+'" '+(editable?'':'disabled')+'>')+'</div>'}).join('')+
    '<div class="d tot'+(tot>me.weekly?' over':'')+'"><label>Total<em>cap '+H(me.weekly)+'h</em></label><div class="val" id="wkTot">'+H(tot)+'</div></div></div>'+
   '<div id="capMsg" style="margin-top:12px"></div>'+
   (win.state==='late'&&editable?'<div style="margin-top:12px"><label class="field"><span>Reason for the delay (required past cutoff)</span>'+
     '<textarea id="f-late" placeholder="Why is this week being filed after the cutoff?"></textarea></label></div>':'')+
   '<div style="margin-top:12px"><label class="field"><span>Notes (optional)</span><textarea id="f-notes" '+(editable?'':'disabled')+'>'+esc(ts?ts.notes:'')+'</textarea></label></div>'+
   (editable?'<div class="row" style="margin-top:14px"><button class="btn" id="saveDraft">Save draft</button>'+
     '<button class="btn primary" id="submitWk">Submit for approval</button>'+
     '<span class="muted" style="font-size:12.5px">Goes to '+esc(uName(me.mgr))+'</span></div>':'')+'</div></div>';
}

/* ── interaction ── */
document.addEventListener('click',function(e){
  if(e.target.classList&&e.target.classList.contains('scrim')){ui.modal=null;return render()}
  const t=e.target.closest('button,tr[data-sel]');if(!t)return;
  const me=session?user(session.user):null;
  const d=t.dataset;
  if(d.close){ui.modal=null;return render()}
  if(t.id==='reset'){seed();session=null;return render()}
  if(t.id==='switch'){session=null;ui.bell=false;return render()}
  if(d.note){const n=S.notifications.find(x=>x.id===d.note);ui.bell=false;
    if(n){n.read=true;if(n.go){ui.tab=n.go.tab;ui.sel=n.go.sel||null;ui.filter=n.go.filter||'all';
      ui.page=0;if(n.go.week)ui.newWeek=n.go.week}}
    return render()}
  if(t.id==='bell'){if(ui.bell)S.notifications.forEach(n=>{if(n.user===me.id)n.read=true});ui.bell=!ui.bell;return render()}
  if(d.tab){ui.tab=d.tab;ui.page=0;ui.picked={};ui.filter=d.tab==='queue'&&me.role==='manager'?'pending':'all';return render()}
  if(d.jump){ui.tab=d.jump;ui.page=0;ui.picked={};ui.filter=d.kfilter||'all';return render()}
  if(d.filter){ui.filter=d.filter;ui.page=0;return render()}
  if(d.page!==undefined){ui.page=+d.page;return render()}
  if(t.id==='allAct'){ui.sel=null;return render()}
  if(d.sel){ui.sel=ui.sel===d.sel?null:d.sel;return render()}
  if(d.week){saveDraft();ui.newWeek=d.week;return render()}
  if(t.id==='saveDraft'){saveDraft();toast('Draft saved.');return render()}
  if(t.id==='submitWk')return trySubmit();
  if(d.approve){ui.modal={kind:'batch',ids:[d.approve]};return render()}
  if(d.returnopen){const ts=S.timesheets.find(x=>x.id===d.returnopen);ui.modal={kind:'return',id:ts.id,owner:ts.user,we:ts.we};return render()}
  if(t.id==='batchApprove'){const ids=Object.keys(ui.picked).filter(k=>ui.picked[k]);if(ids.length)ui.modal={kind:'batch',ids};return render()}
  if(d.override){ui.modal={kind:'override',ts:S.timesheets.find(x=>x.id===d.override)};return render()}
  if(t.id==='markProc'){const ids=Object.keys(ui.picked).filter(k=>ui.picked[k]);if(ids.length)ui.modal={kind:'process',ids,entity:me.entity};return render()}
  if(d.chase){ui.modal={kind:'chase',target:d.chase};return render()}
  if(d.edit){ui.modal={kind:'edit',user:d.edit};return render()}
  if(d.csv)return doCsv(d.csv,me);
  if(d.do)return doAction(d.do,me);
});
document.addEventListener('change',function(e){

document.addEventListener('input',function(e){
  const el=e.target;if(el.dataset.h===undefined)return;
  const me=user(session.user),cap=me.daily||8,hrs=[0,0,0,0,0];
  document.querySelectorAll('[data-h]').forEach(v=>hrs[+v.dataset.h]=parseFloat(v.value)||0);
  const tot=hrs.reduce((a,b)=>a+b,0);
  $('#wkTot').textContent=H(tot);
  $('#wkTot').parentElement.classList.toggle('over',tot>me.weekly);
  const over=hrs.map((h,i)=>h>cap?i:-1).filter(i=>i>=0),msg=$('#capMsg');
  if(over.length)msg.innerHTML='<div class="note bad"><b>Over the daily cap.</b> '+
    over.map(i=>['Monday','Tuesday','Wednesday','Thursday','Friday'][i]).join(', ')+' exceeds '+H(cap)+
    ' hours. A day cannot hold more than the contract allows.</div>';
  else if(tot>me.weekly)msg.innerHTML='<div class="note bad"><b>Over the weekly cap.</b> '+H(tot)+
    ' hours against a cap of '+H(me.weekly)+'. Reduce the week before submitting.</div>';
  else msg.innerHTML='';
});

function currentTarget(me){
  const el=eligibleWeeks(me),open=el.filter(x=>!x.st||x.st==='draft');
  return ui.newWeek||((open[open.length-1]||el[el.length-1]).we);
}
function saveDraft(){
  const me=user(session.user);if(me.pay!=='hourly')return null;
  const target=currentTarget(me);
  let ts=S.timesheets.find(x=>x.user===me.id&&x.we===target);
  if(!ts){ts={id:'TS-'+me.id+'-'+target,user:me.id,we:target,entity:me.entity,stream:null,customer:null,notes:'',draftHours:[0,0,0,0,0]};
    S.timesheets.push(ts);record(ts.id,'created',me.id,{})}
  if(statusOf(ts.id)!=='draft')return ts;
  const hrs=ts.draftHours||[0,0,0,0,0];
  document.querySelectorAll('[data-h]').forEach(v=>hrs[+v.dataset.h]=parseFloat(v.value)||0);
  ts.draftHours=hrs;
  const s=$('#f-stream'),c=$('#f-cust'),n=$('#f-notes');
  if(s)ts.stream=s.value;if(c)ts.customer=c.value||null;if(n)ts.notes=n.value;
  return ts;
}
function trySubmit(){
  const me=user(session.user),ts=saveDraft(),msg=$('#capMsg');
  const st=streamOf(ts),cap=me.daily||8,hrs=ts.draftHours,tot=hrs.reduce((a,b)=>a+b,0);
  const bad=s=>{msg.innerHTML='<div class="note bad">'+s+'</div>'};
  if(st.cust==='required'&&!ts.customer)return bad('<b>Customer required.</b> '+esc(st.name)+' work must name a customer.');
  if(tot<=0)return bad('<b>No hours.</b> Enter at least one day.');
  if(hrs.some(h=>h>cap))return bad('<b>Over the daily cap.</b> A day cannot exceed '+H(cap)+' hours.');
  if(tot>me.weekly)return bad('<b>Over the weekly cap.</b> '+H(tot)+' against '+H(me.weekly)+'.');
  const win=windowOf(ts.we);
  if(win.state==='locked')return bad('<b>Locked.</b> This week closed on '+fDY(win.lock)+'. Ask payroll to reopen it.');
  const late=win.state==='late';
  const lr=$('#f-late')?$('#f-late').value.trim():'';
  if(late&&lr.length<5)return bad('<b>Reason required.</b> This week is past its cutoff \u2014 say why it is late.');
  ui.modal={kind:'submit',ts,total:tot,late,reason:late?lr:null};render();
}
function doAction(kind,me){
  const m=ui.modal;
  if(kind==='submit'){const ts=m.ts;
    record(ts.id,'submitted',me.id,{hours:ts.draftHours.slice(),total:m.total,stream:ts.stream,customer:ts.customer,
      caps:{weekly:me.weekly,daily:me.daily||8},late:m.late,lateReason:m.reason});
    notify(me.mgr,me.name+' submitted the week ending '+fD(P(ts.we))+'.',{tab:'queue',filter:'pending',sel:ts.id});
    ui.modal=null;ui.sel=ts.id;ui.tab='mine';ui.newWeek=null;
    toast('Submitted to '+uName(me.mgr)+'.');return render()}
  if(kind==='return'){const r=$('#m-reason').value.trim();
    if(r.length<5){$('#m-err').textContent='Give a reason they can act on.';return}
    record(m.id,'returned',me.id,{reason:r});
    notify(m.owner,me.name+' returned your week ending '+fD(P(m.we))+'.',{tab:'new',week:m.we,sel:m.id});
    ui.modal=null;ui.sel=m.id;toast('Returned. The submission stays in the trail.');return render()}
  if(kind==='batch'){const batch='BA-'+Date.now().toString(36).toUpperCase();
    m.ids.forEach(id=>{const ts=S.timesheets.find(x=>x.id===id),rt=rateAsOf(S.rates,ts.user,ts.we);
      const tot=lastEv(id,'submitted').payload.total;
      record(id,'approved',me.id,{rate:rt?rt.hourly:0,rateFrom:rt?rt.from:null,total:tot,
        amount:+((rt?rt.hourly:0)*tot).toFixed(2),batch,override:false,comment:null});
      notify(ts.user,me.name+' approved your week ending '+fD(P(ts.we))+'.',{tab:'mine',sel:ts.id})});
    ui.modal=null;ui.picked={};ui.sel=m.ids[0];
    toast(m.ids.length+' approved in batch '+batch+'.');return render()}
  if(kind==='override'){const c=$('#m-reason').value.trim();
    if(c.length<5){$('#m-err').textContent='An override needs a comment.';return}
    const ts=m.ts,rt=rateAsOf(S.rates,ts.user,ts.we),tot=lastEv(ts.id,'submitted').payload.total;
    record(ts.id,'approved',me.id,{rate:rt?rt.hourly:0,rateFrom:rt?rt.from:null,total:tot,
      amount:+((rt?rt.hourly:0)*tot).toFixed(2),batch:'OV-'+Date.now().toString(36).toUpperCase(),override:true,comment:c});
    notify(user(ts.user).mgr,me.name+' override-approved '+uName(ts.user)+'\u2019s week ending '+fD(P(ts.we))+'.',{tab:'queue',filter:'approved',sel:ts.id});
    notify(ts.user,'Your week ending '+fD(P(ts.we))+' was approved by payroll.',{tab:'mine',sel:ts.id});
    ui.modal=null;ui.sel=ts.id;toast('Override recorded.');return render()}
  if(kind==='process'){const batch='PB-'+Date.now().toString(36).toUpperCase();
    m.ids.forEach(id=>{const ts=S.timesheets.find(x=>x.id===id),sn=snapOf(id),run=runForWeek(ts.we);
      record(id,'processed',me.id,{run:run.id,runLabel:run.label+' \u00b7 '+run.year,
        account:ui.accts[id]||accountFor(streamOf(ts),user(ts.user).fn),amount:sn.amount,batch});
      notify(ts.user,'Your week ending '+fD(P(ts.we))+' is in the '+run.label+' pay run.',{tab:'mine',sel:ts.id})});
    ui.modal=null;ui.picked={};ui.accts={};
    toast(m.ids.length+' marked processed in '+batch+'.');return render()}
  if(kind==='chase'){
    S.chases.push({id:nid('c'),at:new Date().toISOString(),by:me.id,target:m.target,
      kind:user(m.target).role==='manager'?'manager':'staff'});
    const tgt=user(m.target);
    const openW=tgt.pay==='hourly'?eligibleWeeks(tgt).filter(x=>(!x.st||x.st==='draft')&&x.w.state!=='future'):[];
    notify(m.target,me.name+' sent you a reminder about an outstanding timesheet.',
      tgt.role==='manager'?{tab:'queue',filter:'pending'}
      :openW.length?{tab:'new',week:openW[openW.length-1].we}:{tab:'mine'});
    ui.modal=null;toast('In-app notification sent \u00b7 reminder email triggered. Email delivery is outside this demo.');return render()}
  if(kind==='raise'){const v=parseFloat($('#e-rate').value),from=$('#e-from').value;
    if(!(v>0)||!from){$('#m-err').textContent='Enter a rate and a start date.';return}
    S.rates.push({id:nid('rt'),user:m.user,hourly:v,from});
    S.adminLog.push({id:nid('al'),at:new Date().toISOString(),actor:me.id,user:m.user,
      text:'Rate row added: '+M(v)+'/h in force from '+fDY(P(from))+'.'});
    notify(m.user,'Your rate changes to '+M(v)+'/h from '+fDY(P(from))+'.',{tab:'dash'});
    toast('Rate row added. Past weeks are untouched \u2014 check Reports.');return render()}
  if(kind==='saveUser'){const u=user(m.user),ent=$('#e-ent').value,fn=$('#e-fn').value,
      weekly=parseFloat($('#e-weekly').value),daily=parseFloat($('#e-daily').value),mgr=$('#e-mgr').value,ch=[];
    if(ent!==u.entity)ch.push('entity \u2192 '+ENTITIES.find(e=>e.id===ent).name);
    if(fn!==u.fn)ch.push('function \u2192 '+fn);
    if(weekly!==u.weekly)ch.push('weekly cap \u2192 '+H(weekly)+'h');
    if(daily!==(u.daily||8))ch.push('daily cap \u2192 '+H(daily)+'h');
    if(mgr!==u.mgr)ch.push('manager \u2192 '+uName(mgr));
    Object.assign(u,{entity:ent,fn,weekly,daily:daily===8?null:daily,mgr});
    if(ch.length)S.adminLog.push({id:nid('al'),at:new Date().toISOString(),actor:me.id,user:u.id,text:ch.join(', ')});
    toast(ch.length?(user(mgr).fn!==fn?'Saved. Cross-department assignment flagged on the record.':'Saved.'):'No changes.');
    ui.modal=null;return render()}
}
function doCsv(kind,me){
  if(kind==='mine'){const rows=[['Week ending','Stream','Customer','Hours','Status','Rate held','Pay','Pay run','Late']];
    sheetsOf(me.id).forEach(t=>{const sn=snapOf(t.id),pr=procOf(t.id),s=lastEv(t.id,'submitted');
      rows.push([t.we,streamOf(t).name,t.customer||'',H(totOf(t)),statusOf(t.id),sn?sn.rate:'',sn?sn.amount:'',
        pr?pr.runLabel:'',s&&s.payload.late?'yes':''])});
    return csv(rows,'my-timesheets.csv')}
  if(kind==='approved'){const rows=[['Person','Week ending','Hours','Rate held','Pay','Approved by','Approved at','Batch','Override']];
    S.timesheets.filter(t=>user(t.user).mgr===me.id&&['approved','processed'].includes(statusOf(t.id)))
      .sort((a,b)=>a.we<b.we?1:-1).forEach(t=>{const sn=snapOf(t.id),a=lastEv(t.id,'approved');
      rows.push([uName(t.user),t.we,H(sn.total),sn.rate,sn.amount,uName(a.actor),a.at,sn.batch||'',sn.override?'yes':''])});
    return csv(rows,'approved-timesheets.csv')}
  const rows=[['Entity','Week ending','Person','Function','Stream','Customer','Hours','Rate held','Rate in force from',
    'Pay','Expense head','Account name','Pay run','Payday','Approved by','Approved at','Override','Processed by','Batch']];
  S.timesheets.filter(t=>t.entity===me.entity&&['approved','processed'].includes(statusOf(t.id)))
    .sort((a,b)=>a.we<b.we?1:-1).forEach(t=>{const sn=snapOf(t.id),pr=procOf(t.id),
      a=lastEv(t.id,'approved'),p=lastEv(t.id,'processed'),run=runForWeek(t.we);
    rows.push([ENTITIES.find(e=>e.id===t.entity).name,t.we,uName(t.user),user(t.user).fn,streamOf(t).name,t.customer||'',
      H(sn.total),sn.rate,sn.rateFrom||'',sn.amount,pr?pr.account:'',pr?ACCOUNTS[pr.account]:'',run.label+' '+run.year,
      run.payday,uName(a.actor),a.at,sn.override?'yes':'',p?uName(p.actor):'',pr?pr.batch:''])});
  return csv(rows,'payroll-report.csv');
}

seed();render();
})();
</script>
